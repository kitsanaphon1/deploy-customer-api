name: Deployment to Server

on:
  push:
    branches: [ "Nonprod" ] # รันเมื่อมีการอัปเดตไฟล์ใน Repo นี้ (ซึ่งบอทจาก App Repo จะเป็นคนแก้ให้)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }} # apiadmin
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. เข้าไปที่โฟลเดอร์โปรเจกต์ (ถ้ายังไม่มีให้ git clone ก่อน)
            cd /home/apiadmin/deploy-customer-api|| git clone https://github.com/kitsanaphon1/deploy-customer-api.git /home/apiadmin/deploy-customer-api
            
            cd /home/apiadmin/deploy-customer-api
            
            # 2. ดึงไฟล์ล่าสุดจาก Git (ซึ่งบอทแก้เลข Tag ไว้ให้แล้ว)
            git pull origin main
            
            # 3. สั่งรัน Docker
            docker compose pull
            docker compose up -d
            
            # 4. ล้าง Image เก่าเพื่อประหยัดที่
            docker image prune -f