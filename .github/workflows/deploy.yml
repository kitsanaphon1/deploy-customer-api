name: Deployment to Server

on:
  push:
    branches: [ "Nonprod" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. เข้าไปที่โฟลเดอร์โปรเจกต์
            cd /home/apiadmin/deploy-customer-api || git clone -b Nonprod https://github.com/kitsanaphon1/deploy-customer-api.git /home/apiadmin/deploy-customer-api
            
            cd /home/apiadmin/deploy-customer-api
            
            # 2. บังคับให้ไฟล์บน Server ตรงกับ GitHub ล่าสุด (แก้ปัญหาเลขเวอร์ชันไม่เปลี่ยน)
            git fetch origin Nonprod
            git reset --hard origin/Nonprod
            
            # 3. สั่งรัน Docker
            docker compose pull
            docker compose up -d
            
            # 4. ล้าง Image เก่า
            docker image prune -f

      # ขั้นตอนใหม่: ยิงสัญญาณไปบอก Repo Import-customer-api ให้เริ่มดึง Spec และ Import เข้า Gateway
      - name: Trigger Import Gateway Workflow
        if: success() # ส่งสัญญาณเฉพาะเมื่อ Deploy สำเร็จเท่านั้น
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.OPS_REPO_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/kitsanaphon1/Import-customer-api/dispatches \
            -d '{"event_type": "deploy_success"}'